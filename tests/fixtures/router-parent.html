<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>d-frame test vue-router parent</title>
  <style>body { margin: 0; width: 800px; }</style>
</head>
<body>
  <script type="module">
    import '/lib/d-frame.ts'
    import { createRouter, createWebHistory } from 'vue-router'
    import createStateChangeAdapter from '/lib/vue-router/state-change-adapter.ts'

    // a parent app that only owns its URL, like a portal page embedding an application
    const router = createRouter({
      history: createWebHistory('/tests/fixtures/router-parent/'),
      routes: [{ path: '/:path(.*)*', component: {} }]
    })
    // tests set these to mimic async middlewares of the parent app (nuxt, auth checks...)
    window.guardDelay = 0
    window.guardAbort = false
    router.beforeEach(async () => {
      if (window.guardDelay) await new Promise(resolve => setTimeout(resolve, window.guardDelay))
      if (window.guardAbort) return false
    })
    window.navigations = []
    router.afterEach((to, _from, failure) => { window.navigations.push({ to: to.fullPath, failure: failure?.type ?? null }) })
    await router.replace(router.options.history.location)
    window.router = router

    window.mountFrame = (attrs = {}) => {
      const frame = document.createElement('d-frame')
      for (const [key, value] of Object.entries(attrs)) frame.setAttribute(key, value)
      frame.adapter = createStateChangeAdapter(router)
      document.body.appendChild(frame)
      return frame
    }
    window.parentReady = true
  </script>
</body>
</html>
